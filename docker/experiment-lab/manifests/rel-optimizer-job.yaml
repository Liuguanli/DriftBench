schema_version: 1
id: rel-optimizer-job
review_only: true
family: relational
component: optimizer
tracker:
  path: experiments/relational/optimizer/README.md
  repository_status: Stub
readiness: plan-only
target_stack:
  kind: postgres-runner
  compose_profile: null
  planned_containers: 2
  runtime_verified: false
  reason: A dedicated PostgreSQL target and one-shot JOB runner are planned; no repository runner exists.
sources:
  - role: Join Order Benchmark
    repo_url: https://github.com/gregrahn/join-order-benchmark
    commit: a39603662e023e449cb2121997a5034df9e02ebf
    archive_url: https://github.com/gregrahn/join-order-benchmark/archive/a39603662e023e449cb2121997a5034df9e02ebf.tar.gz
    archive_sha256: {algorithm: sha256, value: null, status: pending-not-downloaded, reason: Review slice queried commit metadata but downloaded no source archive.}
    license: {spdx: NOASSERTION, status: human-review-required, reason: GitHub exposed no repository license for the pinned commit.}
dataset:
  name: IMDb for JOB
  source: IMDb non-commercial datasets transformed by the JOB loading scripts
  license: {spdx: IMDb-non-commercial-terms, status: human-review-required, reason: IMDb terms and redistribution restrictions require explicit researcher review.}
  checksum: {algorithm: sha256, value: null, status: pending-not-downloaded, reason: IMDb files were not downloaded; each accepted source file needs a lock entry.}
  estimated_download_mib: 3500
  prepared_mib: 15000
  cache_path: ${DRIFTBENCH_LAB_STATE}/cache/imdb-job/
workload:
  seed: 42
  scale: full JOB schema, with a future documented laptop subset if methodologically valid
  query_sets: pinned JOB SQL set and deterministic query-mix order
  drift: template-frequency and predicate-selectivity phases generated by DriftBench
  warmup: 1 EXPLAIN-only pass
  repetitions: 3 measured EXPLAIN ANALYZE passes with statement timeout
  metrics: [plan_hash_changes, estimated_vs_actual_rows, planning_ms, execution_ms]
execution:
  prepare: "FUTURE ONLY — FORBIDDEN IN REVIEW SLICE: accept IMDb terms, verify all hashes, load and ANALYZE a dedicated database."
  run: "FUTURE ONLY — FORBIDDEN IN REVIEW SLICE: emit EXPLAIN (ANALYZE, BUFFERS, FORMAT JSON) for the pinned query order."
  implementation_status: planned
  network_policy: No network during a run; all JOB SQL and IMDb files are pre-verified cache inputs.
  cleanup: Always run Compose down --remove-orphans; preserve logs/results and the opt-in dataset cache.
images:
  - role: PostgreSQL database
    reference: docker.io/library/postgres:16.4-bookworm@sha256:e62fbf9d3e2b49816a32c400ed2dba83e3b361e6833e624024309c35d334b412
    platform_digest_status: pending-future-prepare
  - role: workload runner base
    reference: docker.io/library/python:3.11.9-slim-bookworm@sha256:8fb099199b9f2d70342674bd9dbccd3ed03a258f26bbd1d556822c6dfc60c317
    platform_digest_status: pending-future-prepare
resources:
  tier: devbox-only
  cpus: 8.0
  memory_mib: 16384
  pids: 512
  disk_gib: 50
  services: [postgres, job-runner]
artifacts:
  logs: ${DRIFTBENCH_LAB_STATE}/runs/rel-optimizer-job/${RUN_ID}/logs/
  results: ${DRIFTBENCH_LAB_STATE}/runs/rel-optimizer-job/${RUN_ID}/results/
  metrics: ${DRIFTBENCH_LAB_STATE}/runs/rel-optimizer-job/${RUN_ID}/metrics/
  figures: ${DRIFTBENCH_LAB_STATE}/runs/rel-optimizer-job/${RUN_ID}/figures/
  run_manifest: ${DRIFTBENCH_LAB_STATE}/runs/rel-optimizer-job/${RUN_ID}/run-manifest.json
observability:
  progress_metrics: [driftbench_progress_ratio, driftbench_queries_completed_total]
  result_metrics: [driftbench_plan_change_total, driftbench_q_error, driftbench_query_latency_ms]
  local_dashboard: 127.0.0.1:8765
  grafana: devbox-only-runtime-unverified
  png_export: ${DRIFTBENCH_LAB_STATE}/runs/rel-optimizer-job/${RUN_ID}/figures/
blockers:
  - Component is a documentation stub and has no runner or result parser.
  - Upstream repository and IMDb dataset licensing require human review.
  - Full IMDb/JOB is not a local-lite workload under the current memory and disk budget.
