schema_version: 1
id: rel-buffer-sysbench
review_only: true
family: relational
component: buffer_pool
tracker:
  path: experiments/relational/buffer_pool/README.md
  repository_status: Stub
readiness: plan-only
target_stack:
  kind: postgres-runner
  compose_profile: null
  planned_containers: 2
  runtime_verified: false
  reason: A dedicated PostgreSQL target and separate sysbench driver avoid contaminating other databases.
sources:
  - role: sysbench benchmark
    repo_url: https://github.com/akopytov/sysbench
    commit: 3ceba0b1e115f8c50d1d045a4574d8ed643bd497
    archive_url: https://github.com/akopytov/sysbench/archive/3ceba0b1e115f8c50d1d045a4574d8ed643bd497.tar.gz
    archive_sha256: {algorithm: sha256, value: null, status: pending-not-downloaded, reason: Review slice queried commit metadata but downloaded no source archive.}
    license: {spdx: GPL-2.0, status: metadata-verified, reason: GitHub license metadata at the pinned commit reported GPL-2.0.}
dataset:
  name: sysbench synthetic OLTP tables
  source: Deterministic prepare phase from the pinned sysbench candidate
  license: {spdx: generated-data-review, status: human-review-required, reason: Generated-data retention and redistribution policy will be documented before use.}
  checksum: {algorithm: sha256, value: null, status: pending-not-downloaded, reason: No sysbench source or generated table dump exists in this review slice.}
  estimated_download_mib: 5
  prepared_mib: 1024
  cache_path: ${DRIFTBENCH_LAB_STATE}/cache/sysbench-buffer/
workload:
  seed: 42
  scale: 4 tables x 250000 rows planning target
  phases: [working_set_fits_buffer, working_set_exceeds_buffer, hotspot_shift]
  workload: oltp_read_only with fixed rate and client count
  warmup: 60 seconds
  repetitions: 3 x 120 seconds
  metrics: [transactions_per_sec, latency_p95_ms, shared_hit_ratio, physical_reads, evictions]
execution:
  prepare: "FUTURE ONLY — FORBIDDEN IN REVIEW SLICE: build verified sysbench runner and prepare tables in the dedicated database."
  run: "FUTURE ONLY — FORBIDDEN IN REVIEW SLICE: run bounded read-only phases and snapshot pg_stat_io/pg_statio before and after."
  implementation_status: planned
  network_policy: No network during preparation or measurement; never invoke host drop_caches.
  cleanup: Always run Compose down --remove-orphans; reset only the dedicated run database between phases.
images:
  - role: PostgreSQL database
    reference: docker.io/library/postgres:16.4-bookworm@sha256:e62fbf9d3e2b49816a32c400ed2dba83e3b361e6833e624024309c35d334b412
    platform_digest_status: pending-future-prepare
  - role: sysbench runner base
    reference: docker.io/library/debian:12.7-slim@sha256:36e591f228bb9b99348f584e83f16e012c33ba5cad44ef5981a1d7c0a93eca22
    platform_digest_status: pending-future-prepare
resources:
  tier: local-lite
  cpus: 2.0
  memory_mib: 3840
  pids: 384
  disk_gib: 12
  services: [postgres, sysbench-runner]
artifacts:
  logs: ${DRIFTBENCH_LAB_STATE}/runs/rel-buffer-sysbench/${RUN_ID}/logs/
  results: ${DRIFTBENCH_LAB_STATE}/runs/rel-buffer-sysbench/${RUN_ID}/results/
  metrics: ${DRIFTBENCH_LAB_STATE}/runs/rel-buffer-sysbench/${RUN_ID}/metrics/
  figures: ${DRIFTBENCH_LAB_STATE}/runs/rel-buffer-sysbench/${RUN_ID}/figures/
  run_manifest: ${DRIFTBENCH_LAB_STATE}/runs/rel-buffer-sysbench/${RUN_ID}/run-manifest.json
observability:
  progress_metrics: [driftbench_progress_ratio, driftbench_phase_seconds]
  result_metrics: [driftbench_tps, driftbench_latency_ms, driftbench_buffer_hit_ratio]
  local_dashboard: 127.0.0.1:8765
  grafana: optional-runtime-unverified
  png_export: ${DRIFTBENCH_LAB_STATE}/runs/rel-buffer-sysbench/${RUN_ID}/figures/
blockers:
  - Component is a documentation stub and the sysbench image/runner has not been built or tested.
  - Cache reset, PostgreSQL version, shared_buffers, client rate, and dataset hash are not yet locked.
  - Host filesystem cache cannot be fully controlled safely on Docker Desktop and must be reported as a limitation.
