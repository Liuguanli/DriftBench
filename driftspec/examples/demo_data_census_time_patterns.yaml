pattern_id: census-original-time-patterns
seed: 42

type:
  family: data
  category: drift
  subtype: single_table

data_source:
  kind: csv
  path: ./data/census_original.csv
  schema_extractor:
    source_type: csv
    sample_size: 1000
    schema_output_path: ./output/intermediate_yaml/census_original_schema.json

variables:
  base_table: census_original
  drifts:
    - name: timestamp_uniform
      drift_type: add_timestamp
      source_path: ./data/census_original.csv
      timestamp_column: timestamp
      start_time: "2025-07-01T00:00:00"
      pattern: uniform
      queries_per_minute: 300
      output_path: ./output/data/time_demo/census_original_time_uniform.csv

    - name: timestamp_periodic
      drift_type: add_timestamp
      source_path: ./data/census_original.csv
      timestamp_column: timestamp
      start_time: "2025-07-01T00:00:00"
      pattern: periodic
      queries_per_minute: 300
      output_path: ./output/data/time_demo/census_original_time_periodic.csv

    - name: timestamp_trend
      drift_type: add_timestamp
      source_path: ./data/census_original.csv
      timestamp_column: timestamp
      start_time: "2025-07-01T00:00:00"
      pattern: trend
      queries_per_minute: 300
      output_path: ./output/data/time_demo/census_original_time_trend.csv

    - name: timestamp_long_tail
      drift_type: add_timestamp
      source_path: ./data/census_original.csv
      timestamp_column: timestamp
      start_time: "2025-07-01T00:00:00"
      pattern: long_tail
      queries_per_minute: 300
      output_path: ./output/data/time_demo/census_original_time_long_tail.csv
