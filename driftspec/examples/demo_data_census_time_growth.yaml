pattern_id: census-original-time-growth
seed: 42

type:
  family: data
  category: drift
  subtype: single_table

data_source:
  kind: csv
  path: ./data/census_original.csv
  schema_extractor:
    source_type: csv
    sample_size: 1000
    schema_output_path: ./output/intermediate_yaml/census_original_schema.json

variables:
  base_table: census_original
  drifts:
    - name: base_with_timestamp
      drift_type: add_timestamp
      timestamp_column: timestamp
      start_time: "2025-07-01T00:00:00"
      pattern: uniform
      queries_per_minute: 34
      output_path: ./output/data/time_demo/census_original_with_timestamp.csv

    - name: age_skew
      drift_type: value_skew
      columns: [age]
      portion: 0.4
      skewness: 4
      output_path: ./output/data/time_demo/census_original_age_skew.csv

    - name: age_skew_with_timestamp
      drift_type: add_timestamp
      source_path: ./output/data/time_demo/census_original_age_skew.csv
      timestamp_column: timestamp
      start_time: "2025-07-02T00:00:00"
      pattern: uniform
      queries_per_minute: 34
      output_path: ./output/data/time_demo/census_original_age_skew_with_timestamp.csv

    - name: concat_time_growth
      drift_type: concat_csvs
      input_paths:
        - ./output/data/time_demo/census_original_with_timestamp.csv
        - ./output/data/time_demo/census_original_age_skew_with_timestamp.csv
      sort_by: timestamp
      output_path: ./output/data/time_demo/census_original_time_growth.csv
