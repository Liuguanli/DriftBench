# 1. Scientific question: How do TPC-DS price outliers alter the input distribution?
# 2. Comparison: Baseline is the input; drifted appends high i_current_price rows.
# 3. Strength: Ratio 0.10 and scale 5 expose tail movement without a huge fixture.
# 4. Reproduce: Bind the three declared paths and call driftbench.api.run_spec.
# 5. Scope: This supports input-distribution claims, not performance or causality.
spec_version: 1
pattern_id: visualization-tpcds-price-outliers
seed: 42
type: {family: data, category: drift, subtype: single_table}
metadata:
  benchmark: tpcds
  kind: data
  scenario: price_outliers
  comparison: {table: item, column: i_current_price}
effect_policy:
  mode: all
  assertions:
    - {metric: row_growth_rate, operator: gte, threshold: 0.095}
    - {metric: row_growth_rate, operator: lte, threshold: 0.105}
    - {metric: tail_gain_over_baseline_p99, operator: gte, threshold: 0.08}
    - {metric: normalized_wasserstein_p95_p05, operator: gte, threshold: 0.08}
data_source:
  kind: csv
  path: ${DRIFTBENCH_INPUT}
  schema_extractor: {source_type: csv, sample_size: 1000, schema_output_path: '${DRIFTBENCH_SCHEMA}'}
variables:
  base_table: item
  drifts:
    - name: price_outliers
      drift_type: outlier_injection
      output_path: ${DRIFTBENCH_OUTPUT}
      column: i_current_price
      n_ratio: 0.10
      extreme_direction: high
      extreme_scale: 5
