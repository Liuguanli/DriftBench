pattern_id: tpch-data-cardinality
seed: 42

type:
  family: data
  category: drift
  subtype: multi_table

variables:
  validate_integrity: true
  ddl_path: ./existing_benchmarks/TPC-H V3.0.1/dbgen/dss.ddl
  use_ddl_columns: true

  tables:
    - name: customer
      path: ./existing_benchmarks/benchbase/data/tpch-sf0.01/customer.tbl
      format: tbl
      delimiter: "|"
      drop_last_empty: true
      key_column: c_custkey
      columns:
        - c_custkey
        - c_name
        - c_address
        - c_nationkey
        - c_phone
        - c_acctbal
        - c_mktsegment
        - c_comment
      output_path: ./output/data/tpch/cardinality/customer.csv

    - name: orders
      path: ./existing_benchmarks/benchbase/data/tpch-sf0.01/orders.tbl
      format: tbl
      delimiter: "|"
      drop_last_empty: true
      key_column: o_orderkey
      columns:
        - o_orderkey
        - o_custkey
        - o_orderstatus
        - o_totalprice
        - o_orderdate
        - o_orderpriority
        - o_clerk
        - o_shippriority
        - o_comment
      output_path: ./output/data/tpch/cardinality/orders.csv

    - name: lineitem
      path: ./existing_benchmarks/benchbase/data/tpch-sf0.01/lineitem.tbl
      format: tbl
      delimiter: "|"
      drop_last_empty: true
      key_column: l_orderkey
      columns:
        - l_orderkey
        - l_partkey
        - l_suppkey
        - l_linenumber
        - l_quantity
        - l_extendedprice
        - l_discount
        - l_tax
        - l_returnflag
        - l_linestatus
        - l_shipdate
        - l_commitdate
        - l_receiptdate
        - l_shipinstruct
        - l_shipmode
        - l_comment
      output_path: ./output/data/tpch/cardinality/lineitem.csv

    - name: part
      path: ./existing_benchmarks/benchbase/data/tpch-sf0.01/part.tbl
      format: tbl
      delimiter: "|"
      drop_last_empty: true
      key_column: p_partkey
      columns:
        - p_partkey
        - p_name
        - p_mfgr
        - p_brand
        - p_type
        - p_size
        - p_container
        - p_retailprice
        - p_comment
      output_path: ./output/data/tpch/cardinality/part.csv

    - name: supplier
      path: ./existing_benchmarks/benchbase/data/tpch-sf0.01/supplier.tbl
      format: tbl
      delimiter: "|"
      drop_last_empty: true
      key_column: s_suppkey
      columns:
        - s_suppkey
        - s_name
        - s_address
        - s_nationkey
        - s_phone
        - s_acctbal
        - s_comment
      output_path: ./output/data/tpch/cardinality/supplier.csv

    - name: partsupp
      path: ./existing_benchmarks/benchbase/data/tpch-sf0.01/partsupp.tbl
      format: tbl
      delimiter: "|"
      drop_last_empty: true
      key_column: ps_partkey
      columns:
        - ps_partkey
        - ps_suppkey
        - ps_availqty
        - ps_supplycost
        - ps_comment
      output_path: ./output/data/tpch/cardinality/partsupp.csv

    - name: nation
      path: ./existing_benchmarks/benchbase/data/tpch-sf0.01/nation.tbl
      format: tbl
      delimiter: "|"
      drop_last_empty: true
      key_column: n_nationkey
      columns:
        - n_nationkey
        - n_name
        - n_regionkey
        - n_comment
      output_path: ./output/data/tpch/cardinality/nation.csv

    - name: region
      path: ./existing_benchmarks/benchbase/data/tpch-sf0.01/region.tbl
      format: tbl
      delimiter: "|"
      drop_last_empty: true
      key_column: r_regionkey
      columns:
        - r_regionkey
        - r_name
        - r_comment
      output_path: ./output/data/tpch/cardinality/region.csv

  relationships:
    - name: orders_customer
      fact: orders
      fk: o_custkey
      dim: customer
      pk: c_custkey
    - name: lineitem_orders
      fact: lineitem
      fk: l_orderkey
      dim: orders
      pk: o_orderkey
    - name: lineitem_part
      fact: lineitem
      fk: l_partkey
      dim: part
      pk: p_partkey
    - name: lineitem_supplier
      fact: lineitem
      fk: l_suppkey
      dim: supplier
      pk: s_suppkey
    - name: partsupp_part
      fact: partsupp
      fk: ps_partkey
      dim: part
      pk: p_partkey
    - name: partsupp_supplier
      fact: partsupp
      fk: ps_suppkey
      dim: supplier
      pk: s_suppkey
    - name: supplier_nation
      fact: supplier
      fk: s_nationkey
      dim: nation
      pk: n_nationkey
    - name: customer_nation
      fact: customer
      fk: c_nationkey
      dim: nation
      pk: n_nationkey
    - name: nation_region
      fact: nation
      fk: n_regionkey
      dim: region
      pk: r_regionkey

  drift_steps:
    - op: add_dimension_keys
      target: customer
      fraction: 0.20
      propagate:
        relationship: orders_customer
        policy: reassign
        fact_fraction: 0.20

    - op: add_dimension_keys
      target: part
      fraction: 0.15
      propagate:
        - relationship: lineitem_part
          policy: reassign
          fact_fraction: 0.15
        - relationship: partsupp_part
          policy: reassign
          fact_fraction: 0.15
