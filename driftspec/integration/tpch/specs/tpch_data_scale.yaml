pattern_id: tpch-data-scale
seed: 42

type:
  family: data
  category: drift
  subtype: multi_table

variables:
  validate_integrity: true
  ddl_path: ./existing_benchmarks/TPC-H V3.0.1/dbgen/dss.ddl
  use_ddl_columns: true

  tables:
    - name: customer
      path: ./existing_benchmarks/benchbase/data/tpch-sf0.01/customer.tbl
      format: tbl
      delimiter: "|"
      drop_last_empty: true
      key_column: c_custkey
      output_path: ./output/data/tpch/scale/customer.csv

    - name: orders
      path: ./existing_benchmarks/benchbase/data/tpch-sf0.01/orders.tbl
      format: tbl
      delimiter: "|"
      drop_last_empty: true
      key_column: o_orderkey
      output_path: ./output/data/tpch/scale/orders.csv

    - name: lineitem
      path: ./existing_benchmarks/benchbase/data/tpch-sf0.01/lineitem.tbl
      format: tbl
      delimiter: "|"
      drop_last_empty: true
      key_column: l_orderkey
      output_path: ./output/data/tpch/scale/lineitem.csv

    - name: part
      path: ./existing_benchmarks/benchbase/data/tpch-sf0.01/part.tbl
      format: tbl
      delimiter: "|"
      drop_last_empty: true
      key_column: p_partkey
      output_path: ./output/data/tpch/scale/part.csv

    - name: supplier
      path: ./existing_benchmarks/benchbase/data/tpch-sf0.01/supplier.tbl
      format: tbl
      delimiter: "|"
      drop_last_empty: true
      key_column: s_suppkey
      output_path: ./output/data/tpch/scale/supplier.csv

    - name: partsupp
      path: ./existing_benchmarks/benchbase/data/tpch-sf0.01/partsupp.tbl
      format: tbl
      delimiter: "|"
      drop_last_empty: true
      key_column: ps_partkey
      output_path: ./output/data/tpch/scale/partsupp.csv

    - name: nation
      path: ./existing_benchmarks/benchbase/data/tpch-sf0.01/nation.tbl
      format: tbl
      delimiter: "|"
      drop_last_empty: true
      key_column: n_nationkey
      output_path: ./output/data/tpch/scale/nation.csv

    - name: region
      path: ./existing_benchmarks/benchbase/data/tpch-sf0.01/region.tbl
      format: tbl
      delimiter: "|"
      drop_last_empty: true
      key_column: r_regionkey
      output_path: ./output/data/tpch/scale/region.csv

  relationships:
    - name: orders_customer
      fact: orders
      fk: o_custkey
      dim: customer
      pk: c_custkey
    - name: lineitem_orders
      fact: lineitem
      fk: l_orderkey
      dim: orders
      pk: o_orderkey
    - name: lineitem_part
      fact: lineitem
      fk: l_partkey
      dim: part
      pk: p_partkey
    - name: lineitem_supplier
      fact: lineitem
      fk: l_suppkey
      dim: supplier
      pk: s_suppkey
    - name: partsupp_part
      fact: partsupp
      fk: ps_partkey
      dim: part
      pk: p_partkey
    - name: partsupp_supplier
      fact: partsupp
      fk: ps_suppkey
      dim: supplier
      pk: s_suppkey
    - name: supplier_nation
      fact: supplier
      fk: s_nationkey
      dim: nation
      pk: n_nationkey
    - name: customer_nation
      fact: customer
      fk: c_nationkey
      dim: nation
      pk: n_nationkey
    - name: nation_region
      fact: nation
      fk: n_regionkey
      dim: region
      pk: r_regionkey

  drift_steps:
    - op: scale_sample
      factor: 2

    - op: rewrite_columns
      target: customer
      only_new: true
      columns:
        c_name:
          type: template
          template: "Customer#{c_custkey:09d}"
        c_acctbal:
          type: numeric_jitter
          scale: 1.5
