pattern_id: census-ce-baselines
seed: 42

type:
  family: data
  category: drift
  subtype: single_table

data_source:
  kind: csv
  path: ./data/census_original.csv
  schema_extractor:
    source_type: csv
    sample_size: 1000
    schema_output_path: ./tasks/cardinality_estimation/specs/census_schema.json

variables:
  base_table: census_original
  drifts:
    - name: original_skew_2
      drift_type: value_skew
      columns: ["age", "hours_per_week", "workclass", "education"]
      portion: 1.0
      skewness: 2
      output_path: ./tasks/cardinality_estimation/data/census13/original_skew_2.csv

