spec_version: 1
pattern_id: visualization-ycsb-record-cardinality-reduction
seed: 42
type: {family: data, category: drift, subtype: single_table}
metadata:
  benchmark: ycsb
  kind: data
  scenario: record_cardinality_reduction
  comparison: {table: usertable, column: FIELD0}
effect_policy:
  mode: all
  assertions:
    - {metric: absolute_row_rate, operator: gte, threshold: 0.25}
data_source:
  kind: csv
