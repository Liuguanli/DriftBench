spec_version: 1
pattern_id: visualization-ycsb-field0-hot-value-skew
seed: 42
type: {family: data, category: drift, subtype: single_table}
metadata:
  benchmark: ycsb
  kind: data
  scenario: field0_hot_value_skew
  comparison: {table: usertable, column: FIELD0}
effect_policy:
  mode: all
  assertions:
    - {metric: jensen_shannon_divergence_bits, operator: gte, threshold: 0.20}
    - {metric: total_variation_distance, operator: gte, threshold: 0.30}
data_source:
  kind: csv
  path: ${DRIFTBENCH_INPUT}
  schema_extractor: {source_type: csv, sample_size: 1000, schema_output_path: '${DRIFTBENCH_SCHEMA}'}
variables:
  base_table: usertable
  drifts:
    - name: field0_hot_value_skew
      drift_type: value_skew
      output_path: ${DRIFTBENCH_OUTPUT}
      columns: [FIELD0]
      portion: 0.85
      skewness: 6
