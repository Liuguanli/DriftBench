spec_version: 1
pattern_id: visualization-job-production-year-skew
seed: 42
type: {family: data, category: drift, subtype: single_table}
metadata:
  benchmark: job
  kind: data
  scenario: production_year_skew
  comparison: {table: title, column: production_year}
effect_policy:
  mode: any
  assertions:
    - {metric: ks_distance, operator: gte, threshold: 0.20}
    - {metric: normalized_wasserstein_p95_p05, operator: gte, threshold: 0.12}
data_source:
  kind: csv
  path: ${DRIFTBENCH_INPUT}
  schema_extractor: {source_type: csv, sample_size: 1000, schema_output_path: '${DRIFTBENCH_SCHEMA}'}
variables:
  base_table: title
  drifts:
    - name: production_year_skew
      drift_type: value_skew
      output_path: ${DRIFTBENCH_OUTPUT}
      columns: [production_year]
      portion: 0.80
      skewness: 5
