spec_version: 1
pattern_id: visualization-dsb-lineorder-cardinality-reduction
seed: 42
type: {family: data, category: drift, subtype: single_table}
metadata:
  benchmark: dsb
  kind: data
  scenario: lineorder_cardinality_reduction
  comparison: {table: lineorder, column: revenue}
effect_policy:
  mode: all
  assertions:
    - {metric: row_reduction_rate, operator: gte, threshold: 0.40}
data_source:
  kind: csv
  path: ${DRIFTBENCH_INPUT}
  schema_extractor: {source_type: csv, sample_size: 1000, schema_output_path: '${DRIFTBENCH_SCHEMA}'}
variables:
  base_table: lineorder
  drifts:
    - name: lineorder_cardinality_reduction
      drift_type: vary_cardinality
      output_path: ${DRIFTBENCH_OUTPUT}
      scale: 0.55
