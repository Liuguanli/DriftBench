spec_version: 1
pattern_id: visualization-dsb-revenue-skew
seed: 42
type: {family: data, category: drift, subtype: single_table}
metadata:
  benchmark: dsb
  kind: data
  scenario: revenue_skew
  comparison: {table: lineorder, column: revenue}
effect_policy:
  mode: any
  assertions:
    - {metric: ks_distance, operator: gte, threshold: 0.20}
    - {metric: normalized_wasserstein_p95_p05, operator: gte, threshold: 0.12}
data_source:
  kind: csv
  path: ${DRIFTBENCH_INPUT}
  schema_extractor: {source_type: csv, sample_size: 1000, schema_output_path: '${DRIFTBENCH_SCHEMA}'}
variables:
  base_table: lineorder
  drifts:
    - name: revenue_skew
      drift_type: value_skew
      output_path: ${DRIFTBENCH_OUTPUT}
      columns: [revenue]
      portion: 0.80
      skewness: 5
