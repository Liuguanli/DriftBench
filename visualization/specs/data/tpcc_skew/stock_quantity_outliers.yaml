spec_version: 1
pattern_id: visualization-tpcc-skew-stock-quantity-outliers
seed: 42
type: {family: data, category: drift, subtype: single_table}
metadata:
  benchmark: tpcc_skew
  kind: data
  scenario: stock_quantity_outliers
  comparison: {table: stock, column: s_quantity}
effect_policy:
  mode: all
  assertions:
    - {metric: tail_gain_over_baseline_p99, operator: gte, threshold: 0.04}
    - {metric: normalized_wasserstein_p95_p05, operator: gte, threshold: 0.05}
data_source:
  kind: csv
  path: ${DRIFTBENCH_INPUT}
  schema_extractor: {source_type: csv, sample_size: 1000, schema_output_path: '${DRIFTBENCH_SCHEMA}'}
variables:
  base_table: stock
  drifts:
    - name: stock_quantity_outliers
      drift_type: outlier_injection
      output_path: ${DRIFTBENCH_OUTPUT}
      column: s_quantity
      n_ratio: 0.08
      extreme_direction: high
      extreme_scale: 4
