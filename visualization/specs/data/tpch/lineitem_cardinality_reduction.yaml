spec_version: 1
pattern_id: visualization-tpch-lineitem-cardinality-reduction
seed: 42
type: {family: data, category: drift, subtype: single_table}
metadata:
  benchmark: tpch
  kind: data
  scenario: lineitem_cardinality_reduction
  comparison: {table: lineitem, column: l_extendedprice}
effect_policy:
  mode: all
  assertions:
    - {metric: row_reduction_rate, operator: gte, threshold: 0.40}
data_source:
  kind: csv
  path: ${DRIFTBENCH_INPUT}
  schema_extractor: {source_type: csv, sample_size: 1000, schema_output_path: '${DRIFTBENCH_SCHEMA}'}
variables:
  base_table: lineitem
  drifts:
    - name: lineitem_cardinality_reduction
      drift_type: vary_cardinality
      output_path: ${DRIFTBENCH_OUTPUT}
      scale: 0.55
