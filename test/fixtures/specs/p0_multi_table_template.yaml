      path: test/fixtures/data/dim_users.csv
      output_path: __OUTPUT_DIR__/dim_users_out.csv
      key_column: user_id
    - name: fact_orders
      path: test/fixtures/data/fact_orders.csv
      output_path: __OUTPUT_DIR__/fact_orders_out.csv
      key_column: order_id

  relationships: []
  drift_steps:
