name: Release CI

on:
  push:
    branches:
      - "release/**"
  pull_request:
    branches:
      - "release/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark-regression-pgbench:
    name: benchmark-regression-pgbench
    uses: ./.github/workflows/benchmark-regression-pgbench.yml

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package (editable)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,visualization]"

      - name: Run unittest suite
        run: |
          python -m unittest discover -s test -p 'test_*.py' -v
          python -m unittest discover -s visualization/tests -p 'test_*.py' -v

      - name: Init-agent dry-run contract
        run: |
          python -m driftbench.cli init-agent --dry-run --output ./driftbench-agent

  build:
    name: Build and wheel smoke
    runs-on: ubuntu-latest
    needs: [test, benchmark-regression-pgbench]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build distributions
        run: python -m build

      - name: Wheel smoke (clean venv)
        run: |
          python -m venv /tmp/release-wheel-check
          /tmp/release-wheel-check/bin/pip install --upgrade pip
          /tmp/release-wheel-check/bin/pip install dist/*.whl
          /tmp/release-wheel-check/bin/driftbench-db --help
          /tmp/release-wheel-check/bin/driftbench-db validate-spec driftspec/examples/demo_data_single.yaml --json
          (
            cd /tmp
            /tmp/release-wheel-check/bin/python - <<'PY'
          from pathlib import Path
          import visualization

          root = Path(visualization.__file__).resolve().parent
          assert (root / "GALLERY.md").is_file()
          assert (root / "configs" / "benchmarks.yaml").is_file()
          assert (root / "configs" / "drift_scenarios.yaml").is_file()
          assert len(tuple((root / "figures").rglob("*.png"))) == 40
          assert len(tuple((root / "manifests").rglob("*.json"))) == 40
          assert len(tuple((root / "specs").rglob("*.yaml"))) == 40
          assert not (root / "data").exists()
          assert not (root / "cache").exists()
          PY
          )

      - name: Init-agent real generation structure check
        run: |
          rm -rf /tmp/driftbench-agent-check
          /tmp/release-wheel-check/bin/driftbench-db init-agent --output /tmp/driftbench-agent-check
          test -f /tmp/driftbench-agent-check/AGENTS.md
          test -f /tmp/driftbench-agent-check/README.md
          test -f /tmp/driftbench-agent-check/skills/driftbench/SKILL.md
          test -f /tmp/driftbench-agent-check/references/cli-commands.md
          test -f /tmp/driftbench-agent-check/references/spec-guidelines.md
          test -f /tmp/driftbench-agent-check/examples/workload-drift.yaml
          test -f /tmp/driftbench-agent-check/examples/data-drift.yaml
