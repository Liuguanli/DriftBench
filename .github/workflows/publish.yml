# Publishes DriftBench to PyPI only via manual trigger (workflow_dispatch).
#
# This workflow uses PyPI **trusted publishing** (OIDC). One-time setup on PyPI:
#
#   1. Register the project on https://pypi.org (after first manual upload, or
#      reserve the name via the trusted publisher form on a fresh project).
#   2. Project page → Settings → Publishing → Add a new pending publisher with:
#        Owner:           Liuguanli
#        Repository name: DriftBench
#        Workflow name:   publish.yml
#        Environment:     pypi
#   3. In this GitHub repo, create an environment named `pypi`
#      (Settings → Environments → New environment).
#   4. Trigger this workflow manually from GitHub Actions when you are ready
#      to publish (no auto-publish on git push/tag).
#
# To publish a pre-release to TestPyPI for verification first, run the
# workflow_dispatch with `target=testpypi` (a separate trusted publisher must
# be configured on test.pypi.org).

name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Index to publish to"
        type: choice
        options: [pypi, testpypi]
        default: pypi

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build
        run: |
          python -m pip install --upgrade pip
          pip install build

      - run: python -m build

      - run: ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: driftbench-dist
          path: dist/

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.target == 'pypi' && (github.ref_name == 'main' || startsWith(github.ref_name, 'release-')) }}
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: driftbench-dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

  publish-testpypi:
    name: Publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi' && (github.ref_name == 'main' || startsWith(github.ref_name, 'release-')) }}
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: driftbench-dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
