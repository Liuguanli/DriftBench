name: Notify Web Docs On Release Branch

on:
  push:
    branches:
      - "release/**"

permissions:
  contents: read

jobs:
  notify-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect user-facing DriftBench file changes
        id: detect
        env:
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import pathlib
          import re
          import subprocess

          before = os.environ.get("BEFORE", "")
          sha = os.environ["SHA"]

          if (not before) or re.fullmatch(r"0+", before):
            cmd = ["git", "show", "--pretty=", "--name-only", sha]
          else:
            cmd = ["git", "diff", "--name-only", before, sha]

          proc = subprocess.run(cmd, check=True, text=True, capture_output=True)
          changed = [line.strip() for line in proc.stdout.splitlines() if line.strip()]

          watched_patterns = [
            "README.md",
            "pyproject.toml",
            "setup.cfg",
            "setup.py",
            "docs/**",
            "examples/**",
            "driftbench/agent_templates/**",
            "driftbench/**/init_agent*.py",
            "driftbench/**/cli*.py",
          ]

          relevant = []
          for path in changed:
            p = pathlib.PurePosixPath(path)
            if any(p.match(pattern) for pattern in watched_patterns):
              relevant.append(path)

          out = os.environ["GITHUB_OUTPUT"]
          with open(out, "a", encoding="utf-8") as fh:
            fh.write(f"relevant={'true' if relevant else 'false'}\n")
            fh.write("changed_files_json<<EOF\n")
            fh.write(json.dumps(relevant))
            fh.write("\nEOF\n")
            fh.write("changed_files_text<<EOF\n")
            fh.write("\n".join(relevant))
            fh.write("\nEOF\n")
          PY

      - name: Stop when no relevant files changed
        if: steps.detect.outputs.relevant != 'true'
        run: echo "No relevant user-facing DriftBench files changed; skipping web notification."

      - name: Dispatch update event to driftbench-web
        if: steps.detect.outputs.relevant == 'true'
        env:
          WEB_REPO_TOKEN: ${{ secrets.WEB_REPO_TOKEN }}
          SOURCE_REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
          BRANCH_NAME: ${{ github.ref_name }}
          CHANGED_FILES_JSON: ${{ steps.detect.outputs.changed_files_json }}
          COMPARE_URL: ${{ github.event.compare }}
        run: |
          set -euo pipefail

          # WEB_REPO_TOKEN must have permission to call repository_dispatch
          # on the target repository: Liuguanli/driftbench-web.
          if [ -z "${WEB_REPO_TOKEN}" ]; then
            echo "WEB_REPO_TOKEN is required but not set."
            exit 1
          fi

          PAYLOAD="$(python - <<'PY'
          import json
          import os

          payload = {
            "event_type": "driftbench_release_updated",
            "client_payload": {
              "source_repo": os.environ["SOURCE_REPO"],
              "commit_sha": os.environ["COMMIT_SHA"],
              "ref": os.environ["REF"],
              "branch_name": os.environ["BRANCH_NAME"],
              "changed_files": json.loads(os.environ["CHANGED_FILES_JSON"]),
              "compare_url": os.environ.get("COMPARE_URL", ""),
              "release_context": "release-branch",
            },
          }
          print(json.dumps(payload))
          PY
          )"

          curl -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${WEB_REPO_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/Liuguanli/driftbench-web/dispatches \
            -d "${PAYLOAD}"

          echo "Dispatched event: driftbench_release_updated"
          echo "Changed files:" 
          printf '%s\n' "${{ steps.detect.outputs.changed_files_text }}"
