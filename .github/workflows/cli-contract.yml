name: CLI Contract

on:
  push:
    branches:
      - main
      - "dev/**"
      - "release/**"
  pull_request:
    branches:
      - main
      - "release/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cli-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Command help and legacy compatibility
        run: |
          driftbench --help
          driftbench-db --help
          driftbench validate-spec driftspec/examples/demo_data_single.yaml --json
          driftbench-db validate-spec driftspec/examples/demo_data_single.yaml --json

      - name: trace-to-spec output parameter contract
        run: |
          mkdir -p /tmp/cli-contract
          driftbench-db trace-to-spec driftspec/trace_inputs/trace_data_mock.csv --output /tmp/cli-contract/from_flag.yaml
          test -f /tmp/cli-contract/from_flag.yaml
          driftbench-db trace-to-spec driftspec/trace_inputs/trace_data_mock.csv /tmp/cli-contract/from_positional.yaml
          test -f /tmp/cli-contract/from_positional.yaml

      - name: init-agent contract
        run: |
          rm -rf /tmp/cli-contract-agent
          driftbench-db init-agent --dry-run --output /tmp/cli-contract-agent
          test ! -d /tmp/cli-contract-agent

          driftbench-db init-agent --output /tmp/cli-contract-agent
          test -f /tmp/cli-contract-agent/AGENTS.md
          test -f /tmp/cli-contract-agent/skills/driftbench/SKILL.md

          echo "custom" > /tmp/cli-contract-agent/custom.txt
          set +e
          driftbench-db init-agent --output /tmp/cli-contract-agent
          rc=$?
          set -e
          test "$rc" -ne 0

          driftbench-db init-agent --output /tmp/cli-contract-agent --force
          test -f /tmp/cli-contract-agent/custom.txt
