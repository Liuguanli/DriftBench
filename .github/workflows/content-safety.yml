name: Content Safety Check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  content-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check unexpected Chinese characters in core files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib
          import re
          import subprocess
          import sys

          tracked = subprocess.run(
              ["git", "ls-files"],
              check=True,
              text=True,
              capture_output=True,
          ).stdout.splitlines()

          # Scope: core source/spec/docs/workflow surfaces.
          include_prefixes = (
              ".github/",
              "driftbench/",
              "driftbench_mcp/",
              "driftspec/",
              "docs/",
              "examples/",
              "test/",
              "scripts/",
          )
          include_exact = {"README.md", "pyproject.toml", "setup.py", "setup.cfg"}

          # Allowlist where multilingual text is intentional.
          allow_prefixes = (
              "driftbench/notebooks/",
          )

          han = re.compile(r"[\u4e00-\u9fff]")
          violations = []

          for rel in tracked:
              if not (rel in include_exact or rel.startswith(include_prefixes)):
                  continue
              if rel.startswith(allow_prefixes):
                  continue
              p = pathlib.Path(rel)
              if p.suffix.lower() in {".png", ".jpg", ".jpeg", ".gif", ".pdf", ".ipynb"}:
                  continue
              try:
                  text = p.read_text(encoding="utf-8")
              except Exception:
                  continue
              for i, line in enumerate(text.splitlines(), start=1):
                  if han.search(line):
                      violations.append(f"{rel}:{i}:{line.strip()}")

          if violations:
              print("Unexpected Chinese characters detected:")
              for v in violations[:200]:
                  print(v)
              print(f"Total matches: {len(violations)}")
              sys.exit(1)

          print("No unexpected Chinese characters detected in scoped files.")
          PY

      - name: Check for potential secret/key leakage
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib
          import re
          import subprocess
          import sys

          tracked = subprocess.run(
              ["git", "ls-files"],
              check=True,
              text=True,
              capture_output=True,
          ).stdout.splitlines()

          patterns = [
              re.compile(r"AKIA[0-9A-Z]{16}"),
              re.compile(r"ASIA[0-9A-Z]{16}"),
              re.compile(r"ghp_[A-Za-z0-9]{36}"),
              re.compile(r"gho_[A-Za-z0-9]{36}"),
              re.compile(r"github_pat_[A-Za-z0-9_]{20,}"),
              re.compile(r"xox[baprs]-[A-Za-z0-9-]{10,}"),
              re.compile(r"AIza[0-9A-Za-z\-_]{35}"),
              re.compile(r"-----BEGIN (RSA|EC|OPENSSH|DSA|PRIVATE) KEY-----"),
              re.compile(r"sk-[A-Za-z0-9]{20,}"),
          ]

          # Environment variable names in workflow files are allowed.
          allow_literals = {
              "WEB_REPO_TOKEN",
          }

          violations = []

          for rel in tracked:
              p = pathlib.Path(rel)
              if p.suffix.lower() in {".png", ".jpg", ".jpeg", ".gif", ".pdf", ".ipynb"}:
                  continue
              try:
                  text = p.read_text(encoding="utf-8")
              except Exception:
                  continue
              for i, line in enumerate(text.splitlines(), start=1):
                  if any(name in line for name in allow_literals):
                      continue
                  for pat in patterns:
                      m = pat.search(line)
                      if m:
                          violations.append(f"{rel}:{i}:{m.group(0)}")

          if violations:
              print("Potential secret material detected:")
              for v in violations[:200]:
                  print(v)
              print(f"Total matches: {len(violations)}")
              sys.exit(1)

          print("No high-confidence secret patterns detected in tracked text files.")
          PY
