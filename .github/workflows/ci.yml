name: CI

on:
  push:
    branches: [main, "ui/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Opt into Node 24 early. The default flips on 2026-06-02; opting in now
# surfaces any breakage well before the forced cut-over.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package (editable)
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Smoke check console scripts
        run: |
          driftbench --help
          driftbench-service --help
          driftbench validate-spec driftspec/examples/demo_data_single.yaml --json
          python -c "import driftbench; print(driftbench.__version__)"

      - name: Run unittest suite
        run: python -m unittest discover -s test -p 'test_*.py' -v

  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build distributions
        run: python -m build

      - name: Inspect artifacts
        run: ls -la dist/

      - name: Install built wheel into a clean venv and re-run smoke
        run: |
          python -m venv /tmp/wheel-check
          /tmp/wheel-check/bin/pip install --upgrade pip
          /tmp/wheel-check/bin/pip install dist/*.whl
          /tmp/wheel-check/bin/driftbench --help
          /tmp/wheel-check/bin/python -c "import driftbench; print(driftbench.__version__)"

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: driftbench-dist
          path: dist/
          retention-days: 14
