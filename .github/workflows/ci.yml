name: CI

on:
  push:
    branches: [main, "dev/**", "ui/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Opt into Node 24 early. The default flips on 2026-06-02; opting in now
# surfaces any breakage well before the forced cut-over.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package (editable)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,visualization]"

      - name: Smoke check console scripts
        run: |
          driftbench --help
          driftbench-service --help
          driftbench validate-spec driftspec/examples/demo_data_single.yaml --json
          python -c "import driftbench; print(driftbench.__version__)"

      - name: Run unittest suite
        run: |
          python -m unittest discover -s test -p 'test_*.py' -v
          python -m unittest discover -s visualization/tests -p 'test_*.py' -v

  windows-cp1252-adapters:
    name: Windows CP1252 benchmark adapters
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package (editable)
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run complete adapter suite with strict CP1252 output
        shell: pwsh
        run: |
          $env:PYTHONUTF8 = "0"
          $env:PYTHONIOENCODING = "cp1252:strict"
          python -c "import sys; assert sys.stdout.encoding.lower().replace('-', '') == 'cp1252', sys.stdout.encoding"
          python -c "import unittest; suite = unittest.defaultTestLoader.discover('test/benchmarks', pattern='test_adapter*.py', top_level_dir='.'); count = suite.countTestCases(); print(f'adapter tests discovered: {count}'); assert count == 47, count"
          python -m unittest discover -s test/benchmarks -t . -p 'test_adapter*.py' -v

  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    needs: [test, windows-cp1252-adapters]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build distributions
        run: python -m build

      - name: Inspect artifacts
        run: ls -la dist/

      - name: Install built wheel into a clean venv and re-run smoke
        run: |
          python -m venv /tmp/wheel-check
          /tmp/wheel-check/bin/pip install --upgrade pip
          /tmp/wheel-check/bin/pip install dist/*.whl
          /tmp/wheel-check/bin/driftbench --help
          /tmp/wheel-check/bin/python -c "import driftbench; print(driftbench.__version__)"
          (
            cd /tmp
            /tmp/wheel-check/bin/python - <<'PY'
          from pathlib import Path
          import visualization

          root = Path(visualization.__file__).resolve().parent
          assert (root / "GALLERY.md").is_file()
          assert (root / "configs" / "benchmarks.yaml").is_file()
          assert (root / "configs" / "drift_scenarios.yaml").is_file()
          assert len(tuple((root / "figures").rglob("*.png"))) == 40
          assert len(tuple((root / "manifests").rglob("*.json"))) == 40
          assert len(tuple((root / "specs").rglob("*.yaml"))) == 40
          assert not (root / "data").exists()
          assert not (root / "cache").exists()
          PY
          )

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: driftbench-dist
          path: dist/
          retention-days: 14
