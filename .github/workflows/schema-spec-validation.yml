name: Schema and Spec Validation

on:
  push:
    branches:
      - main
      - "release/**"
  pull_request:
    branches:
      - main
      - "release/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-spec-examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Validate and dry-run all driftspec/examples YAMLs
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t specs < <(find driftspec/examples -type f \( -name '*.yaml' -o -name '*.yml' \) | sort)
          if [ "${#specs[@]}" -eq 0 ]; then
            echo "No spec examples found under driftspec/examples"
            exit 1
          fi

          for spec in "${specs[@]}"; do
            echo "==> validate-spec: ${spec}"
            driftbench-db validate-spec "${spec}" --json >/tmp/spec-validate.json

            echo "==> dry-run: ${spec}"
            driftbench-db dry-run "${spec}" --json >/tmp/spec-dry-run.json
          done

          echo "Validated and dry-ran ${#specs[@]} example specs."
