name: Schema and Spec Validation

on:
  push:
    branches:
      - main
      - "dev/**"
      - "release/**"
  pull_request:
    branches:
      - main
      - "release/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-spec-examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Validate and dry-run changed driftspec/examples YAMLs
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail

          if [ -n "${BASE_REF:-}" ]; then
            git fetch --no-tags --prune origin "${BASE_REF}":"refs/remotes/origin/${BASE_REF}"
            mapfile -t changed < <(git diff --name-only "origin/${BASE_REF}" "${SHA}" | sort)
          elif [ -n "${BEFORE:-}" ] && [ "${BEFORE}" != "0000000000000000000000000000000000000000" ]; then
            mapfile -t changed < <(git diff --name-only "${BEFORE}" "${SHA}" | sort)
          else
            mapfile -t changed < <(git show --pretty= --name-only "${SHA}" | sort)
          fi

          mapfile -t specs < <(
            printf '%s\n' "${changed[@]}" \
              | grep -E '^driftspec/examples/.*\.(ya?ml)$' \
              | grep -Ev '^driftspec/examples/adapters/' \
              | sort -u || true
          )

          if [ "${#specs[@]}" -eq 0 ]; then
            echo "No changed spec examples under driftspec/examples; skipping."
            exit 0
          fi

          for spec in "${specs[@]}"; do
            echo "==> validate-spec: ${spec}"
            driftbench-db validate-spec "${spec}" --json >/tmp/spec-validate.json

            echo "==> dry-run: ${spec}"
            driftbench-db dry-run "${spec}" --json >/tmp/spec-dry-run.json
          done

          echo "Validated and dry-ran ${#specs[@]} example specs."
