name: Prepare Release Branch

on:
  workflow_dispatch:
    inputs:
      source_dev_branch:
        description: "Source dev branch (must be dev/**)"
        required: true
        default: "dev/v0.1.0-stable-release"
        type: string
      release_branch:
        description: "Release branch to create (must be release/v*)"
        required: true
        default: "release/v0.1.0"
        type: string
      dry_run:
        description: "Validate gates only; do not create branch"
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  actions: read

jobs:
  gate-and-create:
    runs-on: ubuntu-24.04
    env:
      SOURCE_DEV_BRANCH: ${{ inputs.source_dev_branch }}
      RELEASE_BRANCH: ${{ inputs.release_branch }}
      DRY_RUN: ${{ inputs.dry_run }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Validate full branch ref names
        shell: bash
        run: |
          set -euo pipefail
          git check-ref-format --branch "${SOURCE_DEV_BRANCH}" >/dev/null
          git check-ref-format --branch "${RELEASE_BRANCH}" >/dev/null
          case "${SOURCE_DEV_BRANCH}" in
            dev/*) ;;
            *) echo "source_dev_branch must match dev/**"; exit 1 ;;
          esac
          case "${RELEASE_BRANCH}" in
            release/v*) ;;
            *) echo "release_branch must match release/v*"; exit 1 ;;
          esac

      - name: Checkout release automation
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve immutable source commit and expected release identity
        id: source
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_REF="refs/heads/${SOURCE_DEV_BRANCH}"
          git fetch --no-tags origin "${SOURCE_REF}"
          SOURCE_SHA="$(git rev-parse --verify 'FETCH_HEAD^{commit}')"
          if [[ ! "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Could not resolve a full source commit SHA"
            exit 1
          fi

          EXPECTED_TAG="${RELEASE_BRANCH#release/}"
          EXPECTED_VERSION="${EXPECTED_TAG#v}"
          if [[ "${EXPECTED_TAG}" != v* || -z "${EXPECTED_VERSION}" ]]; then
            echo "release_branch must derive a non-empty v* tag"
            exit 1
          fi

          {
            echo "SOURCE_SHA=${SOURCE_SHA}"
            echo "EXPECTED_TAG=${EXPECTED_TAG}"
            echo "EXPECTED_VERSION=${EXPECTED_VERSION}"
          } >> "${GITHUB_ENV}"
          echo "source_sha=${SOURCE_SHA}" >> "${GITHUB_OUTPUT}"
          echo "Resolved ${SOURCE_DEV_BRANCH} to immutable ${SOURCE_SHA}"

      - name: Validate version and changelog on immutable source commit
        shell: bash
        run: |
          set -euo pipefail
          git show "${SOURCE_SHA}:pyproject.toml" > /tmp/release-pyproject.toml
          git show "${SOURCE_SHA}:CHANGELOG.md" > /tmp/release-CHANGELOG.md
          python .github/scripts/release_gate.py metadata \
            --expected-tag "${EXPECTED_TAG}" \
            --pyproject /tmp/release-pyproject.toml \
            --changelog /tmp/release-CHANGELOG.md

      - name: Verify required workflows on the exact source commit
        shell: bash
        run: |
          set -euo pipefail
          gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/runs" \
            -f branch="${SOURCE_DEV_BRANCH}" \
            -f event=push \
            -f per_page=100 > /tmp/workflow-runs.json
          python .github/scripts/release_gate.py runs \
            --source-sha "${SOURCE_SHA}" \
            --runs-json /tmp/workflow-runs.json

      - name: Reconfirm source branch has not advanced
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_REF="refs/heads/${SOURCE_DEV_BRANCH}"
          git fetch --no-tags origin "${SOURCE_REF}"
          LATEST_SOURCE_SHA="$(git rev-parse --verify 'FETCH_HEAD^{commit}')"
          python .github/scripts/release_gate.py source \
            --source-sha "${SOURCE_SHA}" \
            --latest-source-sha "${LATEST_SOURCE_SHA}"
          echo "Source branch remains pinned to ${SOURCE_SHA}"

      - name: Create release branch from the verified immutable commit
        if: ${{ inputs.dry_run == false }}
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_REF="refs/heads/${SOURCE_DEV_BRANCH}"
          RELEASE_REF="refs/heads/${RELEASE_BRANCH}"

          # Fetch again in the same step immediately before creation to close
          # the validation-to-push race.
          git fetch --no-tags origin "${SOURCE_REF}"
          LATEST_SOURCE_SHA="$(git rev-parse --verify 'FETCH_HEAD^{commit}')"
          python .github/scripts/release_gate.py source \
            --source-sha "${SOURCE_SHA}" \
            --latest-source-sha "${LATEST_SOURCE_SHA}"
          if git ls-remote --exit-code --heads origin "${RELEASE_REF}" >/dev/null 2>&1; then
            echo "Release branch already exists: ${RELEASE_BRANCH}"
            exit 1
          fi

          git push origin "${SOURCE_SHA}:refs/heads/${RELEASE_BRANCH}"
          REMOTE_RELEASE_SHA="$(git ls-remote --heads origin "${RELEASE_REF}" | awk 'NR == 1 {print $1}')"
          if [[ "${REMOTE_RELEASE_SHA}" != "${SOURCE_SHA}" ]]; then
            echo "Remote release ref does not equal verified source SHA"
            exit 1
          fi
          echo "Created ${RELEASE_BRANCH} at verified commit ${SOURCE_SHA}"

      - name: Dry-run summary
        if: ${{ inputs.dry_run == true }}
        shell: bash
        run: |
          echo "Dry run passed; no branch was pushed."
          echo "Would create ${RELEASE_BRANCH} (${EXPECTED_TAG}) at ${SOURCE_SHA}."
